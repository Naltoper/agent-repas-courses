# DEPRECATED — SmartChef API is deployed on Northflank (see DEPLOY.md).
# Kept only for reference; do not create new Render services from this file.
#
# Render Blueprint — SmartChef API (FastAPI)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smartchef-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATA_DIR
        value: /tmp/smartchef-data
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
